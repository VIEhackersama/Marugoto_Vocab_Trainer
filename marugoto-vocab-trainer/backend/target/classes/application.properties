server.address=127.0.0.1
server.port=8080
spring.application.name=marugoto-vocab-trainer
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB
spring.datasource.url=jdbc:sqlite:${APP_DATA_DIR:./data}/trainer.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
app.data-dir=${APP_DATA_DIR:./data}
app.pdf-dir=${APP_PDF_DIR:${APP_DATA_DIR:./data}/pdfs}
